services:
  app:
    image: ghcr.io/mangeloguy/build-status-dashboard:${IMAGE_TAG:-latest}
    container_name: build-status-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_ENV: production
      DB_PATH: /data/app.db
    volumes:
      - app-data:/data

  # Prometheus scrapes app /metrics and host metrics; Grafana visualises them.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: build-status-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: build-status-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: build-status-grafana
    restart: unless-stopped
    # 3001 mapped to 3000 to avoid clashing with the app's 3000 port.
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  app-data:
  prometheus-data:
  grafana-data:
